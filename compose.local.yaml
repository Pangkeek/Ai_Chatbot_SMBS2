services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: chatbot_local
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql
      - ./scripts/postgresql/init-dev.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_local_data:

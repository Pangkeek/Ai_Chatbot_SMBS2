name: Verify foundation
on: [push, pull_request]
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: chatbot
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatbot -d chatbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://chatbot:ci-test-only@127.0.0.1:5432/chatbot_test
      DB_SSL_MODE: disable
      LINE_WORKER_ENABLED: 'false'
      EVALUATION_REPORT_DIR: reports/ci-task11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11.19.0
      - run: npm run check:toolchain
      - run: npm ci
      - run: npm run test:sqlite
      - run: npm run test:runtime
      - run: npm run test:evaluation
      - run: npm audit --audit-level=high
      - run: npm run test:import
      - run: npm run test:postgres
      - run: npm run test:postgres:schema
      - run: npm run build
        env:
          DATABASE_URL: ''
          LINE_WORKER_ENABLED: 'true'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npm run test:line:runtime
      - run: npm run test:production
      - run: npm run api:check
      - name: Save fixture quality and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task11-evaluation
          path: reports/ci-task11/
          if-no-files-found: warn
  docker-smoke:
    runs-on: ubuntu-latest
    env:
      PORT: '3100'
      COMPOSE_PROJECT_NAME: chatbot-ci
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:3100/health
      - name: Container logs on failure
        if: failure()
        run: docker compose logs
      - name: Remove CI containers and test volume
        if: always()
        run: docker compose down --volumes
